<!doctype html><meta charset="utf-8"><body><iframe id=f style="width:390px;height:844px;border:0"></iframe><pre id=out></pre><script>

 click('#toast [data-a=undo]');await sl(100);ok(St().body[T()]&&St().body[T()].w===103.2,'удаление замера отменено');

 w.S.log[T()].done=false;w.save();w.render();click('.cap [data-a=go]');await sl(150);ok(!q('#run').hidden,'тренировка открыта снова');

 w.history.back();await sl(200);ok(q('#run').hidden&&!w.R,'«Назад» закрывает тренировку');
 // 13 фото
 w.S.photo1=false;w.save();w.render();if(q('[data-a=photo]')){click('[data-a=photo]');await sl(80);ok(St().photo1===true,'фото отмечено');click('#toast [data-a=undo]');await sl(100);ok(!St().photo1,'отметка фото отменена')}else log('SKIP фото (не день 1)');
 // 14 привычки — повторное нажатие снимает

 // 15 даты: нажатие, свайп, прошлое/будущее, «К сегодня»
 click('[data-t=home]');await sl(80);
 var fut=w.addDays(T(),2);click('.dt[data-v="'+fut+'"]');await sl(80);
